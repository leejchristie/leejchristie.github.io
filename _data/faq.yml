- q: Do you speak online?
  a: Yes. Talks run on Teams or Zoom with the same slides and a shorter Q&A.
- q: Can the talk be tailored?
  a: "Every talk is tuned to the room: a 20-minute call beforehand covers the audience and what they should leave with."
- q: What do you need from us?
  a: A screen, a clicker, a handheld mic for Q&A and ten minutes to check the room.
- q: Can we record it?
  a: Usually, yes. Let me know in advance so the slides are cleared for sharing.
